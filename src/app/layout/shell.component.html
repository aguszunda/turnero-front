<mat-toolbar color="primary" class="shell-toolbar">
  <button mat-icon-button aria-label="Abrir menú" (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="brand">💈 Turnero</span>
  <span class="spacer"></span>
  <button mat-button [matMenuTriggerFor]="userMenu">
    <mat-icon>account_circle</mat-icon>
    <span class="user-name">{{ nombreCompleto() }}</span>
  </button>
  <mat-menu #userMenu="matMenu">
    <div class="menu-header">
      <strong>{{ nombreCompleto() }}</strong>
      <span>{{ rol() }}</span>
    </div>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="shell-container">
  <mat-sidenav #sidenav mode="over" class="shell-sidenav">
    <mat-nav-list>
      @for (item of items(); track item.path) {
        <a mat-list-item routerLink="{{ item.path }}" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="shell-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>

<div class="page">
  <header class="page-header">
    <h1>Profesionales</h1>
    <button mat-raised-button color="primary" (click)="abrirForm()">
      <mat-icon>add</mat-icon> Nuevo profesional
    </button>
  </header>

  @if (cargando()) {
    <div class="centrado"><mat-spinner /></div>
  } @else {
    <mat-card appearance="outlined">
      <table mat-table [dataSource]="profesionales()">
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Profesional</th>
          <td mat-cell *matCellDef="let p">
            <strong>{{ p.nombre }} {{ p.apellido }}</strong>
            @if (p.bio) {
              <small>{{ p.bio }}</small>
            }
          </td>
        </ng-container>

        <ng-container matColumnDef="especialidad">
          <th mat-header-cell *matHeaderCellDef>Especialidad</th>
          <td mat-cell *matCellDef="let p">{{ p.especialidad ?? '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="servicios">
          <th mat-header-cell *matHeaderCellDef>Servicios</th>
          <td mat-cell *matCellDef="let p">
            <div class="chips">
              @for (s of p.servicios; track s.id) {
                <span class="chip">{{ s.nombre }}</span>
              }
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="contacto">
          <th mat-header-cell *matHeaderCellDef>Contacto</th>
          <td mat-cell *matCellDef="let p">
            <small>{{ p.email }}<br />{{ p.telefono }}</small>
          </td>
        </ng-container>

        <ng-container matColumnDef="activo">
          <th mat-header-cell *matHeaderCellDef>Activo</th>
          <td mat-cell *matCellDef="let p">
            <mat-slide-toggle [checked]="p.activo" (toggleChange)="toggleActivo(p)" aria-label="Activar/inactivar profesional"></mat-slide-toggle>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let p">
            <button mat-icon-button aria-label="Editar" (click)="abrirForm(false, p)">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </mat-card>
  }
</div>
